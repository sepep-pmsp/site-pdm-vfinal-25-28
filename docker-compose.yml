version: '3.8'
 
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    networks:
      - traefik
    environment:        # 👈 dentro do serviço!
      - SECRET_KEY=MinhaFraseSecret@!1234
 
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    networks:
      - traefik
    depends_on:
      - backend
 
networks:
  traefik:
    driver: bridge      # 👈 indentado corretamente
